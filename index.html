<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nunn.zone</title>
<style>
  body { margin: 0; padding: 24px; font: 15px/1.4 system-ui, sans-serif; background: #15171c; color: #ddd; }
  header { display: flex; justify-content: space-between; align-items: center; margin: 0 0 20px; }
  h1 { margin: 0; font-size: 22px; }
  #toggle { color: #999; text-decoration: none; font-size: 13px; border: 1px solid #333; border-radius: 4px; padding: 4px 10px; }
  #toggle:hover { color: #fff; }
  body:not(.editing) .site button, body:not(.editing) form { display: none; }
  #cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .cat { background: #1e2128; border-radius: 8px; padding: 14px; }
  .cat h2 { margin: 0 0 10px; font-size: 16px; color: #8ab4f8; }
  .site { display: flex; align-items: flex-start; gap: 6px; padding: 6px 0; border-top: 1px solid #2a2e37; }
  .site:first-of-type { border-top: 0; }
  .site a { flex: 1; color: #fff; text-decoration: none; }
  .site a:hover span.n { text-decoration: underline; }
  .site small { display: block; color: #999; }
  .site button { background: none; border: 0; color: #777; cursor: pointer; padding: 0 2px; }
  .site button:hover { color: #fff; }
  form { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; }
  input, form button { background: #1e2128; color: #ddd; border: 1px solid #333; border-radius: 4px; padding: 6px 8px; font: inherit; }
  form button { cursor: pointer; }
</style>
</head>
<body>
<header><h1>The Nunn Zone</h1><a id="toggle" href="#edit">Edit</a></header>
<div id="cats"></div>

<form id="f">
  <input id="cat" placeholder="Category" list="catlist" required>
  <datalist id="catlist"></datalist>
  <input id="name" placeholder="Name" required>
  <input id="url" placeholder="URL" type="url" required>
  <input id="desc" placeholder="Description">
  <button>Save</button>
  <button type="reset">Clear</button>
</form>

<script>
let data = [];
const $ = id => document.getElementById(id);

async function load() {
  data = await (await fetch('/sites.json')).json();
  render();
}

async function save() {
  data = data.filter(c => c.sites.length);
  const r = await fetch('/sites.json', { method: 'PUT', body: JSON.stringify(data) });
  if (!r.ok) alert('Save failed: ' + await r.text());
  load();
}

function render() {
  const cats = $('cats');
  cats.innerHTML = '';
  $('catlist').innerHTML = '';
  data.forEach(c => {
    $('catlist').append(new Option(c.name));
    const div = document.createElement('div');
    div.className = 'cat';
    const h = document.createElement('h2');
    h.textContent = c.name;
    div.append(h);
    c.sites.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'site';
      const a = document.createElement('a');
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = s.name;
      const d = document.createElement('small'); d.textContent = s.description || '';
      a.append(n, d);
      const edit = document.createElement('button');
      edit.textContent = '✎'; edit.title = 'Edit';
      edit.onclick = () => { $('cat').value = c.name; $('name').value = s.name; $('url').value = s.url; $('desc').value = s.description || ''; $('name').focus(); };
      const del = document.createElement('button');
      del.textContent = '✕'; del.title = 'Remove';
      del.onclick = () => { if (confirm('Remove ' + s.name + '?')) { c.sites.splice(i, 1); save(); } };
      row.append(a, edit, del);
      div.append(row);
    });
    cats.append(div);
  });
}

$('f').onsubmit = e => {
  e.preventDefault();
  const catName = $('cat').value.trim();
  const site = { name: $('name').value.trim(), url: $('url').value.trim(), description: $('desc').value.trim() };
  let cat = data.find(c => c.name === catName);
  if (!cat) data.push(cat = { name: catName, sites: [] });
  const existing = cat.sites.findIndex(s => s.name === site.name);
  if (existing >= 0) cat.sites[existing] = site; else cat.sites.push(site);
  $('f').reset();
  save();
};

function setMode() {
  const editing = location.hash === '#edit';
  document.body.classList.toggle('editing', editing);
  $('toggle').textContent = editing ? 'Done' : 'Edit';
  $('toggle').href = editing ? '#' : '#edit';
}
window.onhashchange = setMode;
setMode();

load();
</script>
</body>
</html>
